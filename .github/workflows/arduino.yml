name: Build with PlatformIO

on:
  push:
    branches:
      - main
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Disable Git LFS downloads
        run: |
          git config --global filter.lfs.smudge "git-lfs smudge --skip -- %f"
          git config --global filter.lfs.process "git-lfs filter-process --skip"
    
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: pip install -U platformio==6.1.18

      - name: Build project
        run: pio run -v -e esp32dev -e esp32dev-release
        working-directory: microcontroller-src

      - name: Run tests
        run: pio test -v
        working-directory: microcontroller-src

      - name: Upload firmware binaries
        uses: actions/upload-artifact@v7
        with:
          name: firmware-binaries
          path: |
            microcontroller-src/.pio/build/esp32dev/firmware.bin
            microcontroller-src/.pio/build/esp32dev-release/firmware.bin        
